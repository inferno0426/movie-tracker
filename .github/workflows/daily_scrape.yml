name: Daily Movie Data Scraper

on:
  # ==========================================================
  # 現在「グレイ・ミッション」のデータ取得は停止中のため、
  # 自動スケジュール実行（schedule）を止めています。
  # 新しい映画でデータ取得を再開する場合は、scraper.py 内の
  # MOVIE_NAME / FILMARKS_URL / EIGA_URL を書き換えたうえで、
  # 下記 schedule のコメントアウトを外してください。
  # schedule:
  #   - cron: '0 0 * * *'  # UTC 00:00 = 日本時間 09:00
  workflow_dispatch:
    inputs:
      skip_delay:
        description: 'ランダム待機をスキップ（テスト用）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Random delay (9:00~15:00 JST)
        if: ${{ github.event.inputs.skip_delay != 'true' }}
        run: |
          DELAY=$((RANDOM % 21600))
          echo "Sleeping for ${DELAY} seconds (~$(( DELAY / 60 )) minutes)..."
          sleep $DELAY

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scraper.py

      - name: Commit updated CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add data.csv
          git diff --staged --quiet || git commit -m "data: $(date +'%Y-%m-%d')"
          git push
